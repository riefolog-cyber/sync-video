[mypy]
warn_return_any = True
warn_unused_configs = True
# Typing stretto per i moduli di produzione: ogni funzione deve avere i
# tipi dichiarati (check di CI: `python -m mypy .`).
# I test: ANCHE i test stanno entrando nel check (typing graduale). Restano
# fuori i file storici non annotati — man mano che vengono annotati, la lista
# si accorcia (i nuovi test devono nascere annotati).
disallow_untyped_defs = True
ignore_missing_imports = True
exclude = test_(?!aggiornamenti|prima_sezione|numerazione|cache_maintenance|auto_threads|slow_check|embedder).*\.py$