[mypy]
warn_return_any = True
warn_unused_configs = True
# Typing stretto per i moduli di produzione: ogni funzione deve avere i
# tipi dichiarati (check di CI: `python -m mypy .`).
# I file di test (helper interni senza annotazioni) sono esclusi dal check.
disallow_untyped_defs = True
ignore_missing_imports = True
exclude = test_.*\.py$