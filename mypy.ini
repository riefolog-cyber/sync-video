[mypy]
warn_return_any = True
warn_unused_configs = True
# Typing stretto per i moduli di produzione: ogni funzione deve avere i
# tipi dichiarati (check di CI: `python -m mypy .`).
#
# Anche i test sono nel check (typing graduale). Qui sotto c'e' una
# DENY-LIST dei test storici non annotati, uno per uno: e' volutamente
# una lista di nomi e non un allow-list, cosi' un test NUOVO (test_*.py)
# entra nel check da solo, senza dover essere registrato da qualche parte.
# Man mano che un file storico viene annotato, il suo nome esce da qui.
disallow_untyped_defs = True
ignore_missing_imports = True
exclude = ^.*[/\\]?test_(bootstrap|chunks|check_embedding_models|fastembed_ab|integration|llm_sync|machine_setup|ocr|prompts|slow|sync|transcription|updates|video)\.py$