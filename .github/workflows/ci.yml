name: CI

on:
  push:
  pull_request:
  schedule:
    # Full suite notturna (test lenti inclusi): alle 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    # Permette di lanciare a mano anche il job nightly-full (che
    # altrimenti gira solo col cron, e GitHub lo disabilita dopo
    # 60 giorni di inattivita'). Utile per verificare che i test
    # lenti girino davvero su ubuntu-latest senza aspettare la notte.
    inputs:
      run-slow:
        description: "Esegue anche i test lenti (SYNC_VIDEO_RUN_SLOW=1)"
        type: boolean
        default: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 c'entra per una ragione precisa: audioop e' stato rimosso dalla
        # libreria standard (PEP 594) e pydub lo importa, quindi su un PC con
        # solo 3.13 la trascrizione moriva. Il rimedio (audioop-lts) e' a
        # bordo, ma senza 3.13 in matrice nessuno se ne accorgerebbe al
        # prossimo collega che aggiorna Python.
        #
        # 3.14 NON e' in matrice, e non per dimenticanza: pillow e' bloccato
        # <11 dal pin fastembed==0.5.1, e pillow 10.4.0 pubblica wheel fino a
        # cp313. Su 3.14 pip dovrebbe compilarlo da sorgente. Non si puo'
        # alzare il tetto: fastembed 0.6+ cambia il pooling da CLS a mean e
        # invalida la baseline di embedding validata (vedi requirements.txt).
        # Quando si sblocca il pin, 3.14 va aggiunto qui insieme al test A/B.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Cache HuggingFace (modelli embedding/whisper)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt', 'src/config.py') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Installa dipendenze
        run: pip install -r requirements-dev.txt

      - name: Strumenti di sistema (ffmpeg, Tesseract)
        # L'immagine dietro ubuntu-latest cambia nel tempo e non porta
        # sempre ffmpeg e Tesseract preinstallati. Prima ci pensava
        # il bootstrap dentro la suite, ma ogni installazione ha un timeout di
        # 600s: su un mirror lento scade, e il fallimento arriva poi dai test
        # del PC sano come se il codice fosse rotto (run 39921954759). Qui
        # s'installa una volta per job e l'esito si verifica sul binario,
        # come nel job Windows.
        run: |
          # apt NON e' sempre disponibile: se il mirror e' lento o l'indice non si
          # aggiorna, `apt-get install` esce con il codice 100 e il job cade per
          # un guasto dell'ambiente, non del codice (run 183, 11/11/2026: tutti e
          # quattro i job della matrice rossi sul passo di sistema, mai sui
          # test). Si ritenta; se non riesce, il KO resta QUI, con la causa in
          # chiaro, invece di arrivare dopo dai test come se il codice fosse rotto.
          sudo apt-get update -qq \
            || sudo apt-get update -qq
          # L'italiano e' un pacchetto a parte: se il repo non lo espone si
          # installa solo il base (il bootstrap scarica ita.traineddata).
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ita \
            || sudo apt-get install -y --no-install-recommends tesseract-ocr

          # ffmpeg non da apt: il binario statico di imageio-ffmpeg (dipendenza
          # di moviepy, gia' installata da requirements.txt) e' lo stesso che
          # il job Windows usa come ripiego, e risparmia ~80 MB di dipendenze.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG_BIN="$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")"
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            cp "$FFMPEG_BIN" "$RUNNER_TEMP/ffmpeg/ffmpeg"
            chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg"
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/ffmpeg:$PATH"
          fi

          # Fermarsi qui, con la causa in chiaro, e' meglio che far fallire
          # i test per un guasto dell'ambiente. Entrambi gli strumenti sono
          # obbligatori: ffmpeg per il rendering, Tesseract perche' la suite
          # (soprattutto il test end-to-end notturno) esercita l'OCR vero.
          # Con il solo avviso un Tesseract mancante faceva skippare quel test
          # in silenzio, e la CI passava senza aver verificato niente.
          command -v ffmpeg
          command -v tesseract
          ffmpeg -version | head -1
          tesseract --version | head -1

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Typecheck (mypy)
        run: python -m mypy .

      # `mypy .` su ubuntu copre solo linux: le diramazioni `sys.platform ==
      # "win32"` / `"darwin"` restano non analizzate. Aggiungere le due
      # piattaforme qui, nello stesso job, evita un job extra e tiene
      # allineata la CI a `controlli.py` (che gia' le esegue tutte e tre).
      - name: Typecheck (mypy win32)
        run: python -m mypy --platform win32 .

      - name: Typecheck (mypy darwin)
        run: python -m mypy --platform darwin .

      - name: Test veloci (PR/push; i lenti solo in nightly)
        # I test marcati @slow girano SOLO con SYNC_VIDEO_RUN_SLOW=1 (job
        # nightly sotto): test_end_to_end_minimo, test_lenti (PyMuPDF/FS reali),
        # test_ripresa_equivalente (Whisper small vero), test_revisions_modelli
        # (HuggingFace live). Non sono "futuri": senza il nightly non girano.
        # I .py sono in src/: senza -s src questo comando troverebbe ZERO
        # test e uscirebbe con "OK", facendo passare la CI senza eseguire
        # nulla. E' il perche' del -s esplicito, non una formalta'.
        run: python -m unittest discover -s src -p "test_*.py"

      - name: Smoke entry point aggiornamenti (senza rete ne' installazioni)
        # --no-update-check fa saltare bootstrap (pip/Tesseract/ffmpeg/controllo
        # spazio) e la chiamata a PyPI; --no-update disattiva la domanda. Se uno
        # dei due diventasse decorativo, qui la CI installerebbe cose o batterebbe
        # la rete. check_embedding_models.py NON ha un flag offline (l'unico e'
        # --force, che pero' interroga HuggingFace): ne verifico solo l'import,
        # insieme a huggingface_hub che usa direttamente.
        run: |
          python src/aggiornamenti.py --no-update-check --no-update
          python -c "import sys; sys.path.insert(0, 'src/scripts'); import check_embedding_models, huggingface_hub; print('check_embedding_models import ok')"

  nightly-embed-warmup:
    # La cache del modello e' CONDIVISA dalla matrice notturna: senza questo
    # job, alla prima notte (o dopo uno sgombero cache) solo la 3.12 scaricava
    # il modello e le altre tre versioni skippavano silenziosamente l'E2E,
    # lasciando il job verde senza aver verificato niente. Qui si scarica UNA
    # volta, e `nightly-full` lo aspetta prima di girare.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache modello embedding (serverà a tutta la matrice)
        id: embed-cache
        uses: actions/cache@v4
        with:
          path: .cache/embedding_model
          key: embed-${{ runner.os }}-${{ hashFiles('requirements.txt', 'src/config.py') }}
      - name: Scarica il modello se la cache e' fredda
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements-dev.txt
          python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          from config import DEFAULT_EMBEDDING_CACHE_DIR, DEFAULT_EMBEDDING_MODEL
          from semantic_sync import _load_embed_model
          modello = _load_embed_model(DEFAULT_EMBEDDING_MODEL, str(DEFAULT_EMBEDDING_CACHE_DIR))
          if modello is None:
              raise SystemExit("impossibile scaricare il modello embedding")
          print("modello embedding pronto")
          PY

  nightly-full:
    # Suite completa notturna con test lenti (modelli reali, rete).
    needs: nightly-embed-warmup
    # Gira col cron notturno O se lanciato a mano (workflow_dispatch).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Stessa matrice del job sopra, e per le stesse ragioni.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Cache HuggingFace (modelli embedding/whisper)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt', 'src/config.py') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Installa dipendenze
        run: pip install -r requirements-dev.txt

      - name: Strumenti di sistema (ffmpeg, Tesseract)
        # L'immagine dietro ubuntu-latest cambia nel tempo e non porta
        # sempre ffmpeg e Tesseract preinstallati. Prima ci pensava
        # il bootstrap dentro la suite, ma ogni installazione ha un timeout di
        # 600s: su un mirror lento scade, e il fallimento arriva poi dai test
        # del PC sano come se il codice fosse rotto (run 39921954759). Qui
        # s'installa una volta per job e l'esito si verifica sul binario,
        # come nel job Windows.
        run: |
          # apt NON e' sempre disponibile: se il mirror e' lento o l'indice non si
          # aggiorna, `apt-get install` esce con il codice 100 e il job cade per
          # un guasto dell'ambiente, non del codice (run 183, 11/11/2026: tutti e
          # quattro i job della matrice rossi sul passo di sistema, mai sui
          # test). Si ritenta; se non riesce, il KO resta QUI, con la causa in
          # chiaro, invece di arrivare dopo dai test come se il codice fosse rotto.
          sudo apt-get update -qq \
            || sudo apt-get update -qq
          # L'italiano e' un pacchetto a parte: se il repo non lo espone si
          # installa solo il base (il bootstrap scarica ita.traineddata).
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ita \
            || sudo apt-get install -y --no-install-recommends tesseract-ocr

          # ffmpeg non da apt: il binario statico di imageio-ffmpeg (dipendenza
          # di moviepy, gia' installata da requirements.txt) e' lo stesso che
          # il job Windows usa come ripiego, e risparmia ~80 MB di dipendenze.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG_BIN="$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")"
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            cp "$FFMPEG_BIN" "$RUNNER_TEMP/ffmpeg/ffmpeg"
            chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg"
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/ffmpeg:$PATH"
          fi

          # Fermarsi qui, con la causa in chiaro, e' meglio che far fallire
          # i test per un guasto dell'ambiente. Entrambi gli strumenti sono
          # obbligatori: ffmpeg per il rendering, Tesseract perche' la suite
          # (soprattutto il test end-to-end notturno) esercita l'OCR vero.
          # Con il solo avviso un Tesseract mancante faceva skippare quel test
          # in silenzio, e la CI passava senza aver verificato niente.
          command -v ffmpeg
          command -v tesseract
          ffmpeg -version | head -1
          tesseract --version | head -1

      - name: Cache modello embedding (2 GB, serve al test end-to-end)
        # La suite notturna include la pipeline INTERA: senza questa cache il
        # modello da 2 GB si riscarica ogni notte. SYNC_VIDEO_E2E_SCARICA=1
        # sotto autorizza il download solo quando la cache e' fredda.
        uses: actions/cache@v4
        with:
          path: .cache/embedding_model
          # Il modello da 2 GB si sceglie in src/config.py (DEFAULT_EMBEDDING_MODEL):
          # senza quel file nella chiave, cambiare modello riuserebbe la cache
          # del vecchio e il test end-to-end girerebbe sulle embedding sbagliate.
          key: embed-${{ runner.os }}-${{ hashFiles('requirements.txt', 'src/config.py') }}
          # Nessun restore-key largo: un prefisso del tipo "embed-Linux-" farebbe
          # ripescare la cache vecchia proprio dopo aver cambiato il modello,
          # vanificando l'invalidazione qui sopra. Solo chiave esatta.

      - name: Suite completa (lenti inclusi)
        env:
          # Sempre accesi col cron notturno; col lancio manuale comanda
          # l'input del workflow_dispatch (default: true). Le parentesi
          # servono per avere sempre la stringa "1"/"0", non un booleano.
          SYNC_VIDEO_RUN_SLOW: ${{ (github.event_name == 'schedule' || inputs.run-slow) && '1' || '0' }}
          # Solo la 3.12 puo' SCARICARE il modello embedding (2 GB): una volta
          # in cache, tutte le versioni lo leggono e il test gira ovunque.
          SYNC_VIDEO_E2E_SCARICA: ${{ matrix.python-version == '3.12' && '1' || '0' }}
        # I .py sono in src/: senza -s src questo comando troverebbe ZERO
        # test e uscirebbe con "OK", facendo passare la CI senza eseguire
        # nulla. E' il perche' del -s esplicito, non una formalta'.
        run: python -m unittest discover -s src -p "test_*.py"

  windows-rapido:
    # La prima installazione vive su Windows (.bat, Program Files, registry,
    # lettere disco): i test giravano solo su ubuntu. Una sola versione
    # Python per tenere corto il job (le versioni le copre la matrice sopra);
    # gli strumenti di sistema servono al test del PC sano.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.12-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.12-

      - name: Installa dipendenze
        run: pip install -r requirements-dev.txt

      - name: Tesseract (OCR)
        # `choco` esce 0 anche quando il feed non ha installato niente (504):
        # senza questo controllo i test E2E dell'OCR si skippano e il job resta
        # verde senza aver verificato niente, come succedeva su Linux.
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          if (-not (Get-Command tesseract -ErrorAction SilentlyContinue)) {
            Write-Error "Tesseract non disponibile dopo choco: i test OCR si skipperebbero."
            exit 1
          }
          tesseract --version | Select-Object -First 1

      - name: ffmpeg nel PATH, verificato
        # Misurato il 19/10/2026: il feed di Chocolatey ha risposto 504 sul
        # pacchetto ffmpeg, l'installazione e' stata saltata e il passo e'
        # rimasto verde (choco esce 0 quando installa almeno un pacchetto).
        # Il KO e' arrivato dopo dal test del PC sano, che leggeva "ffmpeg
        # non trovato nel PATH": un guasto dell'ambiente travestito da difetto
        # del codice. Qui l'esito si controlla sul binario, non sull'exit
        # code di choco, e se il feed cade si usa l'ffmpeg statico che
        # imageio-ffmpeg (dipendenza di moviepy, gia' installata) porta dentro.
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Chocolatey non ha installato ffmpeg (uscita $LASTEXITCODE)."
          }

          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::ffmpeg assente dal PATH: uso il binario di imageio-ffmpeg."
            $sorgente = (python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())").Trim()
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $sorgente)) {
              Write-Error "imageio-ffmpeg non ha fornito un ffmpeg utilizzabile."
              exit 1
            }
            $cartella = Join-Path $env:RUNNER_TEMP "ffmpeg"
            New-Item -ItemType Directory -Force -Path $cartella | Out-Null
            Copy-Item -LiteralPath $sorgente -Destination (Join-Path $cartella "ffmpeg.exe")
            Add-Content -Path $env:GITHUB_PATH -Value $cartella
            $env:PATH = "$cartella;$env:PATH"
          }

          # Fermarsi qui, con la causa in chiaro, e' meglio che far fallire il
          # test del PC sano: lo stesso binario mancante sembrerebbe un difetto
          # del programma e la diagnosi costerebbe mezz'ora.
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Error "ffmpeg non disponibile: i test del PC sano fallirebbero per un guasto dell'ambiente."
            exit 1
          }
          ffmpeg -version | Select-Object -First 1

      - name: Test veloci su Windows
        run: python -m unittest discover -s src -p "test_*.py"

  pacchetto:
    # ZIP datato per i colleghi: niente piu' "quale copia hai?". Gira solo sui
    # push su main (mai sulle PR: niente release dai rami) e solo se i test
    # veloci sono verdi su Linux e Windows (needs). La release resta pubblica e
    # scaricabile senza login; una per push, con data+sha nel nome (niente tag
    # mobili).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-typecheck-test, windows-rapido]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Impacchetta lo ZIP
        run: |
          TAG="build-$(date +%Y%m%d)-${GITHUB_SHA::7}-r${GITHUB_RUN_NUMBER}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          git archive HEAD | tar -x -C /tmp/pkg
          echo "$TAG" > /tmp/pkg/VERSIONE.txt
          test -f /tmp/pkg/genera_video.bat
          test -f /tmp/pkg/src/main.py
          cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/sync-video-$TAG.zip" .

      - name: Pubblica release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$TAG" "sync-video-$TAG.zip"
          --title "Sync Video $TAG (automatica)"
          --notes "Pacchetto pronto: scarica, estrai, lancia verifica_pc.bat e poi genera_video.bat. Versione dentro VERSIONE.txt e in --version."

