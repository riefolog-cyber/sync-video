name: CI

on:
  push:
  pull_request:
  schedule:
    # Full suite notturna (test lenti inclusi): alle 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    # Permette di lanciare a mano anche il job nightly-full (che
    # altrimenti gira solo col cron, e GitHub lo disabilita dopo
    # 60 giorni di inattivita'). Utile per verificare che i test
    # lenti girino davvero su ubuntu-latest senza aspettare la notte.
    inputs:
      run-slow:
        description: "Esegue anche i test lenti (SYNC_VIDEO_RUN_SLOW=1)"
        type: boolean
        default: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 c'entra per una ragione precisa: audioop e' stato rimosso dalla
        # libreria standard (PEP 594) e pydub lo importa, quindi su un PC con
        # solo 3.13 la trascrizione moriva. Il rimedio (audioop-lts) e' a
        # bordo, ma senza 3.13 in matrice nessuno se ne accorgerebbe al
        # prossimo collega che aggiorna Python.
        #
        # 3.14 NON e' in matrice, e non per dimenticanza: pillow e' bloccato
        # <11 dal pin fastembed==0.5.1, e pillow 10.4.0 pubblica wheel fino a
        # cp313. Su 3.14 pip dovrebbe compilarlo da sorgente. Non si puo'
        # alzare il tetto: fastembed 0.6+ cambia il pooling da CLS a mean e
        # invalida la baseline di embedding validata (vedi requirements.txt).
        # Quando si sblocca il pin, 3.14 va aggiunto qui insieme al test A/B.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Cache HuggingFace (modelli embedding/whisper)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt', 'config.py') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Strumenti di sistema (ffmpeg, Tesseract)
        # ubuntu-latest e' passata a Ubuntu 26.04 (immagine ubuntu-26.04) e
        # non porta piu' ffmpeg ne' Tesseract preinstallati. Prima ci pensava
        # il bootstrap dentro la suite, ma ogni installazione ha un timeout di
        # 600s: su un mirror lento scade, e il fallimento arriva poi dai test
        # del PC sano come se il codice fosse rotto (run 39921954759). Qui
        # s'installa una volta per job e l'esito si verifica sul binario,
        # come nel job Windows.
        run: |
          sudo apt-get update -qq
          # L'italiano e' un pacchetto a parte; se il repo non lo espone non
          # e' un motivo per fermarsi: il bootstrap scarica ita.traineddata
          # nella cartella del progetto.
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ita \
            || sudo apt-get install -y --no-install-recommends tesseract-ocr

          # ffmpeg non da apt: il binario statico di imageio-ffmpeg (dipendenza
          # di moviepy, gia' installata da requirements.txt) e' lo stesso che
          # il job Windows usa come ripiego, e risparmia ~80 MB di dipendenze.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG_BIN="$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")"
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            cp "$FFMPEG_BIN" "$RUNNER_TEMP/ffmpeg/ffmpeg"
            chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg"
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/ffmpeg:$PATH"
          fi

          # Fermarsi qui, con la causa in chiaro, e' meglio che far fallire
          # test_disco e test_verifica_pc per un guasto dell'ambiente.
          command -v ffmpeg
          command -v tesseract
          ffmpeg -version | head -1
          tesseract --version | head -1

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Typecheck (mypy)
        run: python -m mypy .

      - name: Test veloci (PR/push; i lenti solo in nightly)
        # I test marcati @slow (download modelli, A/B embedding) girano solo
        # con SYNC_VIDEO_RUN_SLOW=1 (job nightly sotto). Oggi tutta la suite
        # e' mockata e veloce (<1s/file), ma il meccanismo resta per i futuri
        # test con rete/modelli reali (vedi test_slow.py).
        # I .py sono in src/: senza -s src questo comando troverebbe ZERO
        # test e uscirebbe con "OK", facendo passare la CI senza eseguire
        # nulla. E' il perche' del -s esplicito, non una formalta'.
        run: python -m unittest discover -s src -p "test_*.py"

  nightly-full:
    # Suite completa notturna con test lenti (modelli reali, rete).
    # Gira col cron notturno O se lanciato a mano (workflow_dispatch).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Stessa matrice del job sopra, e per le stesse ragioni.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Cache HuggingFace (modelli embedding/whisper)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt', 'config.py') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Strumenti di sistema (ffmpeg, Tesseract)
        # ubuntu-latest e' passata a Ubuntu 26.04 (immagine ubuntu-26.04) e
        # non porta piu' ffmpeg ne' Tesseract preinstallati. Prima ci pensava
        # il bootstrap dentro la suite, ma ogni installazione ha un timeout di
        # 600s: su un mirror lento scade, e il fallimento arriva poi dai test
        # del PC sano come se il codice fosse rotto (run 39921954759). Qui
        # s'installa una volta per job e l'esito si verifica sul binario,
        # come nel job Windows.
        run: |
          sudo apt-get update -qq
          # L'italiano e' un pacchetto a parte; se il repo non lo espone non
          # e' un motivo per fermarsi: il bootstrap scarica ita.traineddata
          # nella cartella del progetto.
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ita \
            || sudo apt-get install -y --no-install-recommends tesseract-ocr

          # ffmpeg non da apt: il binario statico di imageio-ffmpeg (dipendenza
          # di moviepy, gia' installata da requirements.txt) e' lo stesso che
          # il job Windows usa come ripiego, e risparmia ~80 MB di dipendenze.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG_BIN="$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")"
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            cp "$FFMPEG_BIN" "$RUNNER_TEMP/ffmpeg/ffmpeg"
            chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg"
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/ffmpeg:$PATH"
          fi

          # Fermarsi qui, con la causa in chiaro, e' meglio che far fallire
          # test_disco e test_verifica_pc per un guasto dell'ambiente.
          command -v ffmpeg
          command -v tesseract
          ffmpeg -version | head -1
          tesseract --version | head -1

      - name: Suite completa (lenti inclusi)
        env:
          SYNC_VIDEO_RUN_SLOW: "1"
        # I .py sono in src/: senza -s src questo comando troverebbe ZERO
        # test e uscirebbe con "OK", facendo passare la CI senza eseguire
        # nulla. E' il perche' del -s esplicito, non una formalta'.
        run: python -m unittest discover -s src -p "test_*.py"

  windows-rapido:
    # La prima installazione vive su Windows (.bat, Program Files, registry,
    # lettere disco): i test giravano solo su ubuntu. Una sola versione
    # Python per tenere corto il job (le versioni le copre la matrice sopra);
    # gli strumenti di sistema servono al test del PC sano.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.12-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.12-

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Tesseract (OCR)
        run: choco install tesseract -y --no-progress

      - name: ffmpeg nel PATH, verificato
        # Misurato il 19/10/2026: il feed di Chocolatey ha risposto 504 sul
        # pacchetto ffmpeg, l'installazione e' stata saltata e il passo e'
        # rimasto verde (choco esce 0 quando installa almeno un pacchetto).
        # Il KO e' arrivato dopo dal test del PC sano, che leggeva "ffmpeg
        # non trovato nel PATH": un guasto dell'ambiente travestito da difetto
        # del codice. Qui l'esito si controlla sul binario, non sull'exit
        # code di choco, e se il feed cade si usa l'ffmpeg statico che
        # imageio-ffmpeg (dipendenza di moviepy, gia' installata) porta dentro.
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Chocolatey non ha installato ffmpeg (uscita $LASTEXITCODE)."
          }

          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::ffmpeg assente dal PATH: uso il binario di imageio-ffmpeg."
            $sorgente = (python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())").Trim()
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $sorgente)) {
              Write-Error "imageio-ffmpeg non ha fornito un ffmpeg utilizzabile."
              exit 1
            }
            $cartella = Join-Path $env:RUNNER_TEMP "ffmpeg"
            New-Item -ItemType Directory -Force -Path $cartella | Out-Null
            Copy-Item -LiteralPath $sorgente -Destination (Join-Path $cartella "ffmpeg.exe")
            Add-Content -Path $env:GITHUB_PATH -Value $cartella
            $env:PATH = "$cartella;$env:PATH"
          }

          # Fermarsi qui, con la causa in chiaro, e' meglio che far fallire il
          # test del PC sano: lo stesso binario mancante sembrerebbe un difetto
          # del programma e la diagnosi costerebbe mezz'ora.
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Error "ffmpeg non disponibile: i test del PC sano fallirebbero per un guasto dell'ambiente."
            exit 1
          }
          ffmpeg -version | Select-Object -First 1

      - name: Test veloci su Windows
        run: python -m unittest discover -s src -p "test_*.py"

  pacchetto:
    # ZIP datato per i colleghi: niente piu' "quale copia hai?". Gira solo sui
    # push su main (mai sulle PR: niente release dai rami) e solo se i test
    # veloci sono verdi (needs). La release resta pubblica e scaricabile senza
    # login; una per push, con data+sha nel nome (niente tag mobili).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-typecheck-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Impacchetta lo ZIP
        run: |
          TAG="build-$(date +%Y%m%d)-${GITHUB_SHA::7}-r${GITHUB_RUN_NUMBER}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          git archive HEAD | tar -x -C /tmp/pkg
          echo "$TAG" > /tmp/pkg/VERSIONE.txt
          test -f /tmp/pkg/genera_video.bat
          test -f /tmp/pkg/src/main.py
          cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/sync-video-$TAG.zip" .

      - name: Pubblica release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$TAG" "sync-video-$TAG.zip"
          --title "Sync Video $TAG (automatica)"
          --notes "Pacchetto pronto: scarica, estrai, lancia verifica_pc.bat e poi genera_video.bat. Versione dentro VERSIONE.txt e in --version."

